<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heaven's Dynasty — Beat Vault</title>
<style>
:root{
  --bg:#0a0e14; --panel:#111823; --panel2:#161f2d; --line:#212c3d; --line2:#2c3a4f;
  --ink:#eaf1fa; --mut:#93a6c2; --dim:#61748f;
  --ice:#7fd0ff; --ice2:#a9e2ff; --gold:#e9c46a; --em:#5ad19b; --red:#ff6b7a;
  --sh:0 6px 24px rgba(0,0,0,.45); --rad:14px;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:
  radial-gradient(1200px 600px at 80% -10%,rgba(127,208,255,.08),transparent 60%),
  radial-gradient(900px 500px at 0% 0%,rgba(233,196,106,.05),transparent 55%),
  var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--ice)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* GATE */
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(800px 400px at 50% 20%,rgba(127,208,255,.10),transparent),var(--bg)}
#gate .box{width:min(92vw,380px);background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line2);border-radius:18px;padding:34px 28px;box-shadow:var(--sh);text-align:center}
#gate .crest{font-size:12px;letter-spacing:.4em;color:var(--ice);margin-bottom:6px}
#gate h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em}
#gate p{color:var(--mut);font-size:13px;margin:0 0 20px}
#pw{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line2);background:#0b1119;
  color:var(--ink);font-size:15px;text-align:center;letter-spacing:.15em;outline:none}
#pw:focus{border-color:var(--ice)}
#gate button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:11px;cursor:pointer;
  background:linear-gradient(180deg,var(--ice2),var(--ice));color:#062033;font-weight:700;font-size:14px;letter-spacing:.06em}
#gerr{color:var(--red);font-size:12px;height:16px;margin-top:8px}

/* HEADER */
header{position:sticky;top:0;z-index:60;backdrop-filter:blur(12px);
  background:linear-gradient(180deg,rgba(10,14,20,.92),rgba(10,14,20,.72));border-bottom:1px solid var(--line)}
.hwrap{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:16px;letter-spacing:.06em}
.brand span{font-size:10px;letter-spacing:.34em;color:var(--ice)}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:11px;border:1px solid var(--line2);
  background:#0b1119;color:var(--ink);font-size:14px;outline:none}
.search input:focus{border-color:var(--ice)}
.search svg{position:absolute;left:12px;top:11px;opacity:.5}
.stat{font-size:12px;color:var(--mut);white-space:nowrap}
.stat b{color:var(--ink)}

/* TOOLBAR */
.tools{max-width:1400px;margin:0 auto;padding:12px 20px 4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{border:0;background:none;color:var(--mut);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.tabs button.on{background:linear-gradient(180deg,var(--ice2),var(--ice));color:#062033}
select,.chip{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:10px;
  padding:8px 12px;font-size:13px;cursor:pointer;outline:none}
select:focus{border-color:var(--ice)}
.chip{color:var(--mut);font-weight:600}
.chip.on{border-color:var(--ice);color:var(--ice);background:rgba(127,208,255,.08)}

/* GRID */
main{max-width:1400px;margin:0 auto;padding:16px 20px 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--rad);padding:15px 16px;transition:.16s;position:relative;overflow:hidden}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh)}
.card.flag{border-color:rgba(233,196,106,.4)}
.card.flag:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold),transparent)}
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.art{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ice);font-weight:700}
.ttl{font-size:16px;font-weight:700;margin:2px 0 8px;letter-spacing:.01em}
.badge{font-size:9px;letter-spacing:.14em;padding:3px 7px;border-radius:20px;text-transform:uppercase;font-weight:700;white-space:nowrap}
.b-flag{background:rgba(233,196,106,.16);color:var(--gold);border:1px solid rgba(233,196,106,.3)}
.b-grimey{background:rgba(255,107,122,.12);color:#ff9aa5;border:1px solid rgba(255,107,122,.25)}
.b-vault{background:rgba(127,208,255,.1);color:var(--ice);border:1px solid rgba(127,208,255,.25)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{font-size:11px;background:#0b1119;border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--mut)}
.pill b{color:var(--ink)}
.lane{font-size:11px;color:var(--dim);margin-bottom:10px}
.stars{display:flex;gap:3px;margin-top:2px}
.star{cursor:pointer;font-size:16px;color:#33415a;transition:.1s;line-height:1}
.star.on{color:var(--gold)}
.star:hover{transform:scale(1.15)}
details.fld{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
details.fld summary{cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
  display:flex;justify-content:space-between;align-items:center;list-style:none;font-weight:600}
details.fld summary::-webkit-details-marker{display:none}
.fldbody{position:relative;margin-top:8px}
.fldbody textarea{width:100%;min-height:74px;resize:vertical;background:#0b1119;border:1px solid var(--line);
  border-radius:9px;color:var(--ink);font-size:12.5px;line-height:1.5;padding:10px 10px 10px;
  font-family:ui-monospace,Menlo,monospace}
.copy{position:absolute;top:6px;right:6px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--mut);border-radius:7px;padding:4px 9px;font-size:10px;letter-spacing:.08em;cursor:pointer;font-weight:700}
.copy:hover{color:var(--ice);border-color:var(--ice)}
.copy.done{color:var(--em);border-color:var(--em)}
.qc{display:flex;gap:8px;margin:2px 0 6px}
.qbtn{flex:1;background:linear-gradient(180deg,var(--ice2),var(--ice));color:#062033;border:0;border-radius:9px;padding:10px;font-size:11px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.qbtn:hover{filter:brightness(1.08)}
.qbtn2{background:var(--panel2);border:1px solid var(--line2);color:var(--mut);border-radius:9px;padding:10px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.qbtn2:hover{color:var(--ice);border-color:var(--ice)}
.qbtn.done,.qbtn2.done{outline:2px solid var(--em);outline-offset:-2px}
.empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:14px}

/* EXPORT */
#exp{position:fixed;bottom:20px;right:20px;z-index:70;padding:12px 18px;border:1px solid rgba(127,208,255,.4);
  border-radius:12px;cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.08em;
  background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--ice);box-shadow:var(--sh)}
#exp:hover{background:linear-gradient(180deg,var(--ice2),var(--ice));color:#062033}
@media(max-width:600px){.grid{grid-template-columns:1fr}.hwrap{padding:10px 14px}main,.tools{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="crest">◆ HEAVEN'S DYNASTY ◆</div>
    <h1>Beat Vault</h1>
    <p>Enter passcode to unlock the archive</p>
    <input id="pw" type="password" placeholder="• • • • • • •" autocomplete="off">
    <button onclick="unlock()">UNLOCK</button>
    <div id="gerr"></div>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <div class="hwrap">
    <div class="brand"><b>BEAT VAULT</b><span>HEAVEN'S DYNASTY</span></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search artist, title, sound, key…" oninput="render()">
    </div>
    <div class="stat" id="stat"></div>
  </div>
  <div class="tools">
    <div class="tabs" id="tabs">
      <button data-c="all" class="on" onclick="setCol('all')">All</button>
      <button data-c="Beat Vault v3" onclick="setCol('Beat Vault v3')">Vault</button>
      <button data-c="Grimey Hit Formulas" onclick="setCol('Grimey Hit Formulas')">Grimey</button>
    </div>
    <select id="fart" onchange="render()"><option value="">All artists</option></select>
    <select id="ftempo" onchange="render()"><option value="">Any tempo</option><option>Slow</option><option>Mid</option><option>Fast</option></select>
    <select id="fmood" onchange="render()"><option value="">Any mood</option></select>
    <button class="chip" id="cflag" onclick="tgl('flag')">◆ Flagship</button>
    <button class="chip" id="crated" onclick="tgl('rated')">★ Rated 4+</button>
  </div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" style="display:none">No beats match.</div></main>
</div>

<button id="exp" onclick="exportRatings()">⬇ EXPORT RATINGS</button>

let PROMPTS=[], col="all", fFlag=false, fRated=false;
const bin=s=>{const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
async function decrypt(pw){
  const salt=bin(CRY.salt),iv=bin(CRY.iv),ct=bin(CRY.cipher);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(){
  const pw=document.getElementById('pw').value.trim();
  try{ PROMPTS=await decrypt(pw); boot(); }
  catch(e){ document.getElementById('gerr').textContent="Wrong passcode."; }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});

function getR(){try{return JSON.parse(localStorage.getItem('hd_ratings')||'{}')}catch(e){return {}}}
function beatId(p){return p.artist+'|'+p.title}
function setRating(i,v){const p=PROMPTS[i],r=getR(),id=beatId(p);if(r[id]===v)delete r[id];else r[id]=v;localStorage.setItem('hd_ratings',JSON.stringify(r));render();}
function tgl(w){if(w==='flag'){fFlag=!fFlag;document.getElementById('cflag').classList.toggle('on',fFlag)}else{fRated=!fRated;document.getElementById('crated').classList.toggle('on',fRated)}render();}
function setCol(c){col=c;[...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('on',b.dataset.c===c));render();}
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copy(btn,txt){const o=btn.textContent;navigator.clipboard.writeText(txt).then(()=>{btn.textContent='✓ COPIED';btn.classList.add('done');setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1200)});}

function boot(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  const arts=[...new Set(PROMPTS.map(p=>p.artist))].sort();
  document.getElementById('fart').innerHTML='<option value="">All artists</option>'+arts.map(a=>`<option>${esc(a)}</option>`).join('');
  const moods=[...new Set(PROMPTS.map(p=>p.mood).filter(Boolean))].sort();
  document.getElementById('fmood').innerHTML='<option value="">Any mood</option>'+moods.map(m=>`<option>${esc(m)}</option>`).join('');
  render();
}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const fa=document.getElementById('fart').value, ft=document.getElementById('ftempo').value, fm=document.getElementById('fmood').value;
  const R=getR();
  const rows=PROMPTS.map((p,i)=>[p,i]).filter(([p,i])=>{
    if(col!=='all'&&p.collection!==col)return false;
    if(fa&&p.artist!==fa)return false;
    if(ft&&p.tempo!==ft)return false;
    if(fm&&(p.mood||'')!==fm)return false;
    if(fFlag&&p.tier!=='Flagship')return false;
    if(fRated&&!(R[beatId(p)]>=4))return false;
    if(q){const hay=(p.artist+' '+p.title+' '+(p.style||'')+' '+(p.key||'')+' '+(p.mood||'')+' '+(p.lane||'')).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  document.getElementById('stat').innerHTML=`<b>${rows.length}</b> of ${PROMPTS.length} beats`;
  const g=document.getElementById('grid'), em=document.getElementById('empty');
  em.style.display=rows.length?'none':'block';
  g.innerHTML=rows.map(([p,i])=>{
    const rv=R[beatId(p)]||0;
    const stars=[1,2,3,4,5].map(s=>`<span class="star ${s<=rv?'on':''}" onclick="setRating(${i},${s})">★</span>`).join('');
    const badge=p.tier==='Flagship'?'<span class="badge b-flag">◆ Flagship</span>':
      (p.collection==='Grimey Hit Formulas'?'<span class="badge b-grimey">Grimey</span>':'<span class="badge b-vault">Vault</span>');
    const fld=(lbl,val)=>val?`<details class="fld"><summary>${lbl}</summary><div class="fldbody"><button class="copy" onclick="copy(this,this.nextElementSibling.value)">COPY</button><textarea readonly>${esc(val)}</textarea></div></details>`:'';
    return `<div class="card ${p.tier==='Flagship'?'flag':''}">
      <div class="crow"><div class="art">${esc(p.artist)}</div>${badge}</div>
      <div class="ttl">${esc(p.title)}</div>
      <div class="meta"><span class="pill">BPM <b>${esc(p.bpm||'—')}</b></span><span class="pill">KEY <b>${esc(p.key||'—')}</b></span><span class="pill">${esc(p.tempo||'')}</span>${p.mood?`<span class="pill">${esc(p.mood)}</span>`:''}</div>
      ${p.lane?`<div class="lane">${esc(p.lane)}</div>`:''}
      <div class="qc"><button class="qbtn" onclick="copy(this,PROMPTS[${i}].style)">⧉ COPY STYLE</button><button class="qbtn2" onclick="copy(this,PROMPTS[${i}].exclude)">⧉ EXCLUDE</button></div>
      ${fld('Style',p.style)}${fld('Exclude',p.exclude)}${fld('Structure',p.structure)}
      <div class="stars" title="Rate">${stars}</div>
    </div>`;
  }).join('');
}
function exportRatings(){const d=localStorage.getItem('hd_ratings')||'{}';const n=Object.keys(JSON.parse(d)).length;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='hd_ratings.json';document.body.appendChild(a);a.click();a.remove();
  const b=document.getElementById('exp');b.textContent='✓ '+n+' EXPORTED';setTimeout(()=>b.textContent='⬇ EXPORT RATINGS',1500);}
window.addEventListener('load',()=>document.getElementById('pw').focus());
</script>
